<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo | DuckStyle Mayorista</title>

    <meta name="description" content="Catálogo online de DuckStyle Mayorista. Perfumes, ropa, tecnología y mucho más.">

    <link rel="icon" href="favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Cormorant Garamond", serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: white;
            padding: 18px 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            text-decoration: none;
            color: #111;
            display: inline-block;
        }

        .alma {
            font-family: "Allura", cursive;
            font-size: 46px;
            line-height: 35px;
        }

        .boho {
            font-size: 25px;
            letter-spacing: 6px;
            font-weight: 700;
        }

        .tagline {
            font-size: 14px;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
        }

        nav a {
            text-decoration: none;
            color: #222;
            font-size: 16px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 30px 15px 80px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 38px;
        }

        .filtros {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
        }

        .filtros-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
            background: white;
        }

        .productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .producto {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
            transition: transform .2s;
        }

        .producto:hover {
            transform: translateY(-3px);
        }

        .producto-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }

        .producto-info {
            padding: 15px;
        }

        .producto-info h2 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .codigo {
            font-size: 13px;
            color: #777;
            margin-bottom: 8px;
        }

        .precio {
            font-size: 24px;
            font-weight: 700;
        }

        .precio-anterior {
            color: #888;
            text-decoration: line-through;
            font-size: 15px;
        }

        .oferta {
            display: inline-block;
            background: #111;
            color: white;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .color {
            margin-top: 8px;
            font-size: 15px;
        }

        .talles {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .talle {
            border: 1px solid #ccc;
            padding: 5px 9px;
            border-radius: 5px;
            font-size: 14px;
        }

        .boton-producto {
            display: block;
            text-align: center;
            text-decoration: none;
            background: #111;
            color: white;
            padding: 10px;
            border-radius: 7px;
            margin-top: 12px;
        }

        .sin-productos {
            text-align: center;
            padding: 50px 20px;
            background: white;
            border-radius: 12px;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        footer a {
            color: white;
            text-decoration: none;
        }

        .contacto {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .whatsapp-flotante {
            position: fixed;
            right: 18px;
            bottom: 18px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #25D366;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,.25);
            z-index: 1000;
        }

        #cantidadCarrito {
            font-weight: 700;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.8);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal img {
            max-width: 95%;
            max-height: 90vh;
            border-radius: 10px;
        }

        .cerrar-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            color: white;
            font-size: 35px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .alma {
                font-size: 40px;
            }

            .boho {
                font-size: 21px;
            }

            h1 {
                font-size: 32px;
            }

            .productos {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .producto-info {
                padding: 10px;
            }

            .producto-info h2 {
                font-size: 18px;
            }

            .precio {
                font-size: 20px;
            }

            .boton-producto {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="logo">
        <div class="alma">DuckStyle</div>
        <div class="boho">MAYORISTA</div>
        <div class="tagline">Perfumes • Ropa • Tecnología • Mucho más</div>
    </a>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="ofertas.html">Ofertas</a>
        <a href="nuevo.html">Novedades</a>
        <a href="index.html#contacto">Contacto</a>
        <a href="carrito.html">
            Carrito (<span id="cantidadCarrito">0</span>)
        </a>
    </nav>
</header>

<main>

    <h1>Catálogo</h1>

    <section class="filtros">

        <div class="filtros-grid">

            <input
                type="text"
                id="buscador"
                placeholder="Buscar producto..."
            >

            <select id="filtroTalle">
                <option value="">Todos los talles</option>
            </select>

            <select id="filtroColor">
                <option value="">Todos los colores</option>
            </select>

            <select id="filtroPrecio">
                <option value="">Todos los precios</option>
                <option value="0-10000">Hasta $10.000</option>
                <option value="10000-20000">$10.000 - $20.000</option>
                <option value="20000-50000">$20.000 - $50.000</option>
                <option value="50000-999999999">Más de $50.000</option>
            </select>

        </div>

    </section>

    <section id="productos" class="productos">
        <div class="sin-productos">
            Cargando productos...
        </div>
    </section>

</main>

<div id="modal" class="modal">
    <span class="cerrar-modal">&times;</span>
    <img id="modalImagen" src="" alt="Producto">
</div>

<footer>

    <strong>DUCKSTYLE MAYORISTA</strong>

    <div class="contacto">

        <a
            href="https://wa.me/5491156266122"
            target="_blank"
        >
            WhatsApp
        </a>

        <a
            href="https://www.instagram.com/duckstyle_imp?stkn=ZXN0MncxNTBsOWJs"
            target="_blank"
        >
            Instagram
        </a>

    </div>

    <p style="margin-top:15px;">
        © 2026 DuckStyle Mayorista
    </p>

</footer>

<a
    class="whatsapp-flotante"
    href="https://wa.me/5491156266122"
    target="_blank"
    aria-label="WhatsApp"
>
    ☎
</a>

<script>
    let productos = [];
    let productosFiltrados = [];

    const contenedorProductos =
        document.getElementById("productos");

    const buscador =
        document.getElementById("buscador");

    const filtroTalle =
        document.getElementById("filtroTalle");

    const filtroColor =
        document.getElementById("filtroColor");

    const filtroPrecio =
        document.getElementById("filtroPrecio");

    async function cargarProductos() {

        const { data, error } = await supabase
            .from("Productos")
            .select("*")
            .order("id", { ascending: false });

        if (error) {
            console.error(error);

            contenedorProductos.innerHTML = `
                <div class="sin-productos">
                    <h2>No se pudieron cargar los productos</h2>
                    <p>Revisá la conexión con la base de datos.</p>
                </div>
            `;

            return;
        }

        productos = data || [];
        productosFiltrados = [...productos];

        cargarFiltros();
        mostrarProductos();
        actualizarCarrito();
    }

    function cargarFiltros() {

        const talles = new Set();
        const colores = new Set();

        productos.forEach(producto => {

            if (producto.Talles) {

                const listaTalles =
                    String(producto.Talles)
                        .split(",")
                        .map(t => t.trim())
                        .filter(Boolean);

                listaTalles.forEach(talle =>
                    talles.add(talle)
                );
            }

            if (producto.Color) {

                colores.add(
                    String(producto.Color).trim()
                );
            }
        });

        filtroTalle.innerHTML =
            `<option value="">Todos los talles</option>`;

        [...talles]
            .sort()
            .forEach(talle => {

                const option =
                    document.createElement("option");

                option.value = talle;
                option.textContent = talle;

                filtroTalle.appendChild(option);
            });

        filtroColor.innerHTML =
            `<option value="">Todos los colores</option>`;

        [...colores]
            .sort()
            .forEach(color => {

                const option =
                    document.createElement("option");

                option.value = color;
                option.textContent = color;

                filtroColor.appendChild(option);
            });
    }
        function aplicarFiltros() {

        const texto =
            buscador.value.toLowerCase().trim();

        const talle =
            filtroTalle.value;

        const color =
            filtroColor.value;

        const precio =
            filtroPrecio.value;

        productosFiltrados =
            productos.filter(producto => {

                const nombre =
                    String(producto.Nombre || "")
                        .toLowerCase();

                const codigo =
                    String(producto.Codigo || "")
                        .toLowerCase();

                const coincideBusqueda =
                    !texto ||
                    nombre.includes(texto) ||
                    codigo.includes(texto);

                const coincideTalle =
                    !talle ||
                    String(producto.Talles || "")
                        .split(",")
                        .map(t => t.trim())
                        .includes(talle);

                const coincideColor =
                    !color ||
                    String(producto.Color || "")
                        .toLowerCase() ===
                    color.toLowerCase();

                let coincidePrecio = true;

                const precioProducto =
                    Number(producto.Precio) || 0;

                if (precio) {

                    const [min, max] =
                        precio.split("-").map(Number);

                    coincidePrecio =
                        precioProducto >= min &&
                        precioProducto <= max;
                }

                return (
                    coincideBusqueda &&
                    coincideTalle &&
                    coincideColor &&
                    coincidePrecio
                );
            });

        mostrarProductos();
    }


    function mostrarProductos() {

        if (!productosFiltrados.length) {

            contenedorProductos.innerHTML = `
                <div class="sin-productos">
                    <h2>No encontramos productos</h2>
                    <p>Probá cambiando los filtros o la búsqueda.</p>
                </div>
            `;

            return;
        }

        contenedorProductos.innerHTML =
            productosFiltrados.map(producto => {

                const precio =
                    Number(producto.Precio) || 0;

                const precioAnterior =
                    Number(producto.PrecioAnterior) || 0;

                const tieneOferta =
                    producto.Oferta === true ||
                    producto.Oferta === "true";

                const imagen =
                    producto.Foto ||
                    "https://via.placeholder.com/500x500?text=DuckStyle";

                const talles =
                    String(producto.Talles || "")
                        .split(",")
                        .map(t => t.trim())
                        .filter(Boolean);

                return `
                    <article class="producto">

                        <a href="producto.html?id=${producto.id}">
                            <img
                                class="producto-img"
                                src="${imagen}"
                                alt="${producto.Nombre || "Producto"}"
                                loading="lazy"
                                onclick="abrirImagen(event, '${imagen}')"
                            >
                        </a>

                        <div class="producto-info">

                            ${
                                tieneOferta
                                ? `<span class="oferta">OFERTA</span>`
                                : ""
                            }

                            <h2>
                                ${producto.Nombre || "Producto"}
                            </h2>

                            ${
                                producto.Codigo
                                ? `
                                    <div class="codigo">
                                        Código: ${producto.Codigo}
                                    </div>
                                  `
                                : ""
                            }

                            ${
                                tieneOferta && precioAnterior
                                ? `
                                    <div class="precio-anterior">
                                        $${precioAnterior.toLocaleString("es-AR")}
                                    </div>
                                  `
                                : ""
                            }

                            <div class="precio">
                                $${precio.toLocaleString("es-AR")}
                            </div>

                            ${
                                producto.Color
                                ? `
                                    <div class="color">
                                        Color: ${producto.Color}
                                    </div>
                                  `
                                : ""
                            }

                            ${
                                talles.length
                                ? `
                                    <div class="talles">
                                        ${talles.map(talle => `
                                            <span class="talle">
                                                ${talle}
                                            </span>
                                        `).join("")}
                                    </div>
                                  `
                                : ""
                            }

                            <a
                                class="boton-producto"
                                href="producto.html?id=${producto.id}"
                            >
                                Ver producto
                            </a>

                        </div>

                    </article>
                `;

            }).join("");
    }


    function abrirImagen(event, imagen) {

        event.preventDefault();
        event.stopPropagation();

        const modal =
            document.getElementById("modal");

        const modalImagen =
            document.getElementById("modalImagen");

        modalImagen.src = imagen;
        modal.style.display = "flex";
    }


    const modal =
        document.getElementById("modal");

    const cerrarModal =
        document.querySelector(".cerrar-modal");

    cerrarModal.addEventListener("click", () => {
        modal.style.display = "none";
    });


    modal.addEventListener("click", event => {

        if (event.target === modal) {
            modal.style.display = "none";
        }

    });


    buscador.addEventListener(
        "input",
        aplicarFiltros
    );

    filtroTalle.addEventListener(
        "change",
        aplicarFiltros
    );

    filtroColor.addEventListener(
        "change",
        aplicarFiltros
    );

    filtroPrecio.addEventListener(
        "change",
        aplicarFiltros
    );


    function actualizarCarrito() {

        const carrito =
            JSON.parse(
                localStorage.getItem("carrito")
            ) || [];

        const cantidad =
            document.getElementById(
                "cantidadCarrito"
            );

        const cantidadTotal =
            carrito.reduce(
                (total, producto) =>
                    total + (producto.cantidad || 1),
                0
            );

        if (cantidad) {
            cantidad.textContent =
                cantidadTotal;
        }
    }


    document.addEventListener(
        "DOMContentLoaded",
        () => {
            cargarProductos();
        }
    );
</script>

</body>
</html>
