<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DuckStyle Mayorista - Administración</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
}

header {
    background: #111;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
}

.contenedor {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.caja {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

input,
select {
    width: 100%;
    padding: 12px;
    margin: 6px 0 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 10px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    cursor: pointer;
    background: #111;
    color: white;
    font-weight: bold;
    margin: 5px 0;
}

button:hover {
    opacity: .9;
}

.boton-rojo {
    background: #c62828;
}

.boton-gris {
    background: #777;
}

.oculto {
    display: none !important;
}

.categoria-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    border-bottom: 1px solid #ddd;
}

.producto {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
}

.producto img {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 8px;
}

.talle-fila {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
}

.talle-numero {
    min-width: 70px;
    font-weight: bold;
}

.talle-fila input {
    margin: 0;
}

.quitar-talle {
    background: #c62828;
}

#fotoActual img {
    max-width: 150px;
    border-radius: 8px;
    margin-top: 10px;
}
</style>
</head>

<body>

<header>
    <h1>🦆 DuckStyle Mayorista</h1>
    <p>Panel de administración</p>
</header>

<div class="contenedor">

<!-- LOGIN -->

<div id="login" class="caja">

    <h2>Iniciar sesión</h2>

    <label>Correo</label>

    <input
        type="email"
        id="email"
        placeholder="Correo"
    >

    <label>Contraseña</label>

    <input
        type="password"
        id="password"
        placeholder="Contraseña"
    >

    <button
        type="button"
        id="btnLogin"
        onclick="iniciarSesion()"
    >
        INGRESAR
    </button>

    <p id="mensajeLogin"></p>

</div>


<!-- ADMIN -->

<div id="admin" class="oculto">

    <div class="caja">

        <button
            id="btnCerrarSesion"
            class="boton-rojo"
        >
            CERRAR SESIÓN
        </button>

    </div>


    <!-- CATEGORÍAS -->

    <div class="caja">

        <h2>Categorías</h2>

        <input
            type="text"
            id="nuevaCategoria"
            placeholder="Ej: Perfumes"
        >

        <button
            id="btnAgregarCategoria"
        >
            ➕ AGREGAR CATEGORÍA
        </button>

        <div id="listaCategorias">
            Cargando...
        </div>

    </div>


    <!-- FORMULARIO -->

    <div
        class="caja oculto"
        id="formulario"
    >

        <h2 id="tituloFormulario">
            Nuevo producto
        </h2>

        <input
            type="hidden"
            id="productoId"
        >

        <label>Nombre</label>

        <input
            type="text"
            id="nombre"
            placeholder="Nombre del producto"
        >


        <label>Código</label>

        <input
            type="text"
            id="codigo"
            placeholder="Código"
        >


        <label>Categoría</label>

        <select id="categoria">
            <option value="">
                Seleccionar categoría
            </option>
        </select>


        <label>Color (opcional)</label>

        <input
            type="text"
            id="color"
            placeholder="Ej: Negro"
        >


        <label>Precio</label>

        <input
            type="number"
            id="precio"
            placeholder="Precio"
        >


        <label>
            <input
                type="checkbox"
                id="oferta"
                style="width:auto"
                onchange="mostrarPrecioAnterior()"
            >
            Producto en oferta
        </label>


        <div
            id="campoPrecioAnterior"
            class="oculto"
        >

            <label>Precio anterior</label>

            <input
                type="number"
                id="precioAnterior"
                placeholder="Precio anterior"
            >

        </div>


        <label>
            <input
                type="checkbox"
                id="nuevo"
                style="width:auto"
            >
            Producto nuevo
        </label>


        <!-- TALLES -->

        <h3>Talles / Stock</h3>

        <input
            type="text"
            id="nuevoTalle"
            placeholder="Ej: 40, S, M, L"
        >

        <button
            type="button"
            onclick="agregarTalle()"
        >
            ➕ AGREGAR TALLE
        </button>

        <div id="tallesAdmin"></div>


        <!-- FOTO -->

        <label>Foto</label>

        <input
            type="file"
            id="foto"
            accept="image/*"
        >

        <div id="fotoActual"></div>


        <br>

        <button
            type="button"
            id="btnGuardar"
            onclick="guardarProducto()"
        >
            💾 GUARDAR PRODUCTO
        </button>

        <button
            type="button"
            class="boton-gris"
            onclick="cancelarFormulario()"
        >
            CANCELAR
        </button>

    </div>


    <!-- PRODUCTOS -->

    <div class="caja">

        <h2>Productos actuales</h2>

        <button
            type="button"
            onclick="mostrarFormulario()"
        >
            ➕ NUEVO PRODUCTO
        </button>

        <div id="lista">
            Cargando...
        </div>

    </div>

</div>

</div>


<script>

const ADMIN_UID =
"0ea64141-8f93-47d0-94c9-f11329b0468b";

let tallesActuales = {};

let categoriasActuales = [];

let productoEditando = null;


/* PRECIO ANTERIOR */

function mostrarPrecioAnterior() {

    const oferta =
        document.getElementById("oferta").checked;

    const campo =
        document.getElementById(
            "campoPrecioAnterior"
        );

    if (oferta) {

        campo.classList.remove("oculto");

    } else {

        campo.classList.add("oculto");

        document.getElementById(
            "precioAnterior"
        ).value = "";

    }
}


/* LOGIN */

async function iniciarSesion() {

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    const mensaje =
        document.getElementById(
            "mensajeLogin"
        );

    if (!email || !password) {

        mensaje.textContent =
            "Completá correo y contraseña.";

        return;
    }

    mensaje.textContent =
        "Ingresando...";

    const { data, error } =
        await supabaseClient.auth
        .signInWithPassword({

            email,
            password

        });

    if (error) {

        console.error(error);

        mensaje.textContent =
            "Correo o contraseña incorrectos.";

        return;
    }

    if (
        !data.user ||
        data.user.id !== ADMIN_UID
    ) {

        await supabaseClient.auth.signOut();

        mensaje.textContent =
            "Este usuario no es administrador.";

        return;
    }

    document
        .getElementById("login")
        .classList
        .add("oculto");

    document
        .getElementById("admin")
        .classList
        .remove("oculto");

    await cargarCategorias();

    await cargarProductos();

}


/* CERRAR SESIÓN */

async function cerrarSesion() {

    await supabaseClient.auth.signOut();

    document
        .getElementById("admin")
        .classList
        .add("oculto");

    document
        .getElementById("login")
        .classList
        .remove("oculto");
}


/* CATEGORÍAS */

async function cargarCategorias() {

    const lista =
        document.getElementById(
            "listaCategorias"
        );

    const select =
        document.getElementById(
            "categoria"
        );

    const { data, error } =
        await supabaseClient
        .from("Categorias")
        .select("*")
        .eq("Activo", true)
        .order("Nombre", {
            ascending: true
        });

    if (error) {

        console.error(error);

        lista.innerHTML =
            "Error al cargar categorías.";

        return;
    }

    categoriasActuales =
        data || [];

    select.innerHTML =
        `<option value="">
            Seleccionar categoría
        </option>`;

    categoriasActuales.forEach(
        categoria => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                categoria.Nombre;

            option.textContent =
                categoria.Nombre;

            select.appendChild(option);

        }
    );

    lista.innerHTML = "";

    categoriasActuales.forEach(
        categoria => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "categoria-item";

            const nombre =
                document.createElement(
                    "strong"
                );

            nombre.textContent =
                categoria.Nombre;

            const boton =
                document.createElement(
                    "button"
                );

            boton.className =
                "boton-rojo";

            boton.textContent =
                "🗑️ ELIMINAR";

            boton.onclick = () =>
                eliminarCategoria(
                    categoria.id
                );

            div.appendChild(nombre);

            div.appendChild(boton);

            lista.appendChild(div);

        }
    );
}


/* AGREGAR CATEGORÍA */

async function agregarCategoria() {

    const input =
        document.getElementById(
            "nuevaCategoria"
        );

    const nombre =
        input.value.trim();

    if (!nombre) {

        alert(
            "Escribí el nombre de la categoría."
        );

        return;
    }

    const slug =
        nombre
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .replace(
            /[^a-z0-9]+/g,
            "-"
        )
        .replace(
            /^-+|-+$/g,
            ""
        );

    const { error } =
        await supabaseClient
        .from("Categorias")
        .insert({

            Nombre: nombre,

            Slug: slug,

            Activo: true

        });

    if (error) {

        alert(
            "No se pudo agregar la categoría.\n\n" +
            error.message
        );

        return;
    }

    input.value = "";

    await cargarCategorias();
}


/* ELIMINAR CATEGORÍA */

async function eliminarCategoria(id) {

    if (
        !confirm(
            "¿Seguro que querés eliminar esta categoría?"
        )
    ) {
        return;
    }

    const { error } =
        await supabaseClient
        .from("Categorias")
        .update({
            Activo: false
        })
        .eq("id", id);

    if (error) {

        alert(
            "No se pudo eliminar.\n\n" +
            error.message
        );

        return;
    }

    await cargarCategorias();
}


/* =========================
   TALLES
========================= */

function renderizarTalles() {

    const contenedor =
        document.getElementById("tallesAdmin");

    contenedor.innerHTML = "";

    Object.entries(tallesActuales).forEach(
        ([talle, stock]) => {

            const fila =
                document.createElement("div");

            fila.className = "talle-fila";

            const nombre =
                document.createElement("span");

            nombre.className =
                "talle-numero";

            nombre.textContent =
                talle;

            const input =
                document.createElement("input");

            input.type = "number";
            input.min = "0";
            input.value = stock;
            input.placeholder = "Stock";

            input.addEventListener(
                "input",
                () => {

                    tallesActuales[talle] =
                        Number(input.value) || 0;

                }
            );

            const quitar =
                document.createElement("button");

            quitar.type = "button";
            quitar.className =
                "quitar-talle";

            quitar.textContent = "✕";

            quitar.onclick = () => {

                delete tallesActuales[talle];

                renderizarTalles();

            };

            fila.appendChild(nombre);
            fila.appendChild(input);
            fila.appendChild(quitar);

            contenedor.appendChild(fila);

        }
    );
}


function agregarTalle() {

    const input =
        document.getElementById(
            "nuevoTalle"
        );

    const valor =
        input.value.trim();

    if (!valor) {

        alert(
            "Escribí un talle."
        );

        return;
    }

    const talles =
        valor
        .split(",")
        .map(t => t.trim())
        .filter(Boolean);

    talles.forEach(talle => {

        if (!(talle in tallesActuales)) {

            tallesActuales[talle] = 0;

        }

    });

    input.value = "";

    renderizarTalles();
}


/* =========================
   PRODUCTOS
========================= */

async function cargarProductos() {

    const lista =
        document.getElementById("lista");

    lista.innerHTML =
        "Cargando productos...";

    const { data, error } =
        await supabaseClient
        .from("Productos")
        .select("*")
            .order("created_at", {
            ascending: false
        });

    if (error) {

        console.error(error);

        lista.innerHTML =
            "Error al cargar productos:<br><br>" +
            error.message;

        return;
    }

    if (!data || data.length === 0) {

        lista.innerHTML =
            "Todavía no hay productos.";

        return;
    }

    lista.innerHTML = "";

    data.forEach(producto => {

        const div =
            document.createElement("div");

        div.className =
            "producto";

        let talles = {};

        if (
            typeof producto.Talles ===
            "string"
        ) {

            try {

                talles =
                    JSON.parse(
                        producto.Talles ||
                        "{}"
                    );

            } catch {

                talles = {};

            }

        } else {

            talles =
                producto.Talles ||
                {};

        }

        const textoTalles =
            Object.entries(talles)
            .map(
                ([talle, stock]) =>
                    `${talle}: ${stock}`
            )
            .join(" | ");

        div.innerHTML = `

            ${
                producto.Foto
                ? `
                    <img
                        src="${producto.Foto}"
                        alt="${producto.Nombre}"
                    >
                `
                : ""
            }

            <h3>
                ${producto.Nombre}
            </h3>

            <p>
                <strong>Código:</strong>
                ${producto.Codigo || "-"}
            </p>

            <p>
                <strong>Categoría:</strong>
                ${producto.Categoria || "-"}
            </p>

            <p>
                <strong>Color:</strong>
                ${producto.Color || "-"}
            </p>

            <p>
                <strong>Precio:</strong>
                $${producto.Precio}
            </p>

            ${
                producto.Oferta
                ? `
                    <p>
                        <strong>
                            Precio anterior:
                        </strong>
                        $${producto.PrecioAnterior || "-"}
                    </p>
                `
                : ""
            }

            <p>
                <strong>Talles / Stock:</strong>
                ${textoTalles || "Sin talles"}
            </p>

            <p>
                <strong>Nuevo:</strong>
                ${producto.Nuevo ? "Sí" : "No"}
            </p>

            <button
                onclick='editarProducto(${JSON.stringify(producto)})'
            >
                ✏️ EDITAR
            </button>

            <button
                class="boton-rojo"
                onclick="eliminarProducto('${producto.id}')"
            >
                🗑️ ELIMINAR
            </button>

        `;

        lista.appendChild(div);

    });
}


/* =========================
   MOSTRAR FORMULARIO
========================= */

function mostrarFormulario() {

    productoEditando = null;

    document
        .getElementById("formulario")
        .classList
        .remove("oculto");

    document
        .getElementById("tituloFormulario")
        .textContent =
            "Nuevo producto";

    document
        .getElementById("btnGuardar")
        .textContent =
            "💾 GUARDAR PRODUCTO";

    limpiarFormulario();

}


/* =========================
   EDITAR PRODUCTO
========================= */

function editarProducto(producto) {

    productoEditando =
        producto;

    document
        .getElementById("formulario")
        .classList
        .remove("oculto");

    document
        .getElementById("tituloFormulario")
        .textContent =
            "Editar producto";

    document
        .getElementById("productoId")
        .value =
            producto.id;

    document
        .getElementById("nombre")
        .value =
            producto.Nombre || "";

    document
        .getElementById("codigo")
        .value =
            producto.Codigo || "";

    document
        .getElementById("categoria")
        .value =
            producto.Categoria || "";

    document
        .getElementById("color")
        .value =
            producto.Color || "";

    document
        .getElementById("precio")
        .value =
            producto.Precio || "";

    document
        .getElementById("oferta")
        .checked =
            producto.Oferta === true;

    document
        .getElementById("nuevo")
        .checked =
            producto.Nuevo === true;

    document
        .getElementById("precioAnterior")
        .value =
            producto.PrecioAnterior || "";

    mostrarPrecioAnterior();


    if (
        typeof producto.Talles ===
        "string"
    ) {

        try {

            tallesActuales =
                JSON.parse(
                    producto.Talles ||
                    "{}"
                );

        } catch {

            tallesActuales = {};

        }

    } else {

        tallesActuales =
            producto.Talles || {};

    }

    renderizarTalles();


    const fotoActual =
        document.getElementById(
            "fotoActual"
        );

    if (producto.Foto) {

        fotoActual.innerHTML = `

            <p>Foto actual:</p>

            <img
                src="${producto.Foto}"
                alt="Foto actual"
            >

        `;

    } else {

        fotoActual.innerHTML = "";

    }

    document
        .getElementById("btnGuardar")
        .textContent =
            "💾 ACTUALIZAR PRODUCTO";

}


/* =========================
   ELIMINAR PRODUCTO
========================= */

async function eliminarProducto(id) {

    if (
        !confirm(
            "¿Seguro que querés eliminar este producto?"
        )
    ) {
        return;
    }

    const { error } =
        await supabaseClient
        .from("Productos")
        .delete()
        .eq("id", id);

    if (error) {

        alert(
            "No se pudo eliminar el producto.\n\n" +
            error.message
        );

        return;
    }

    alert(
        "Producto eliminado correctamente."
    );

    await cargarProductos();
}


/* =========================
   GUARDAR PRODUCTO
========================= */

async function guardarProducto() {

    const nombre =
        document
        .getElementById("nombre")
        .value
        .trim();

    const codigo =
        document
        .getElementById("codigo")
        .value
        .trim();

    const categoria =
        document
        .getElementById("categoria")
        .value;

    const color =
        document
        .getElementById("color")
        .value
        .trim();

    const precio =
        Number(
            document
            .getElementById("precio")
            .value
        );

    const oferta =
        document
        .getElementById("oferta")
        .checked;

    const nuevo =
        document
        .getElementById("nuevo")
        .checked;

    const precioAnterior =
        oferta
        ? Number(
            document
            .getElementById(
                "precioAnterior"
            )
            .value
        ) || null
        : null;


    if (!nombre) {

        alert(
            "Completá el nombre."
        );

        return;
    }


    if (!categoria) {

        alert(
            "Seleccioná una categoría."
        );

        return;
    }


    if (!precio || precio <= 0) {

        alert(
            "Completá un precio válido."
        );

        return;
    }


    const btn =
        document.getElementById(
            "btnGuardar"
        );

    btn.disabled = true;

    btn.textContent =
        "Guardando...";


    try {

        let fotoUrl =
            productoEditando?.Foto ||
            null;


        const archivo =
            document
            .getElementById("foto")
            .files[0];


        /* SUBIR FOTO */

        if (archivo) {

            const extension =
                archivo.name
                .split(".")
                .pop()
                .toLowerCase();

            const nombreArchivo =
                "producto-" +
                Date.now() +
                "." +
                extension;


            const { error:
                uploadError
            } =
                await supabaseClient
                .storage
                .from("Productos")
                .upload(
                    nombreArchivo,
                    archivo,
                    {
                        upsert: true,
                        contentType:
                            archivo.type
                    }
                );


            if (uploadError) {

                throw new Error(
                    "Error al subir la foto: " +
                    uploadError.message
                );

            }


            const { data:
                urlData
            } =
                supabaseClient
                .storage
                .from("Productos")
                .getPublicUrl(
                    nombreArchivo
                );


            fotoUrl =
                urlData.publicUrl;

        }


        /* DATOS DEL PRODUCTO */

        const producto = {

            Nombre:
                nombre,

            Codigo:
                codigo,

            Categoria:
                categoria,

            Color:
                color || null,

            Precio:
                precio,

            PrecioAnterior:
                precioAnterior,

            Oferta:
                oferta,

            Nuevo:
                nuevo,

            Talles:
                JSON.stringify(
                    tallesActuales
                ),

            Foto:
                fotoUrl

        };


        let error;


        /* EDITAR */

        if (
            productoEditando?.id
        ) {

            ({
                error
            } =
                await supabaseClient
                .from("Productos")
                .update(producto)
                .eq(
                    "id",
                    productoEditando.id
                ));

        }


        /* NUEVO */

        else {

            ({
                error
            } =
                await supabaseClient
                .from("Productos")
                .insert(
                    producto
                ));

        }


        if (error) {

            throw new Error(
                error.message
            );

        }


        alert(
            productoEditando
            ? "Producto actualizado correctamente."
            : "Producto guardado correctamente."
        );


        limpiarFormulario();


        document
            .getElementById(
                "formulario"
            )
            .classList
            .add("oculto");


        await cargarProductos();


    } catch (error) {

        console.error(error);

        alert(
            "No se pudo guardar el producto.\n\n" +
            error.message
        );

    } finally {

        btn.disabled = false;

        btn.textContent =
            productoEditando
            ? "💾 ACTUALIZAR PRODUCTO"
            : "💾 GUARDAR PRODUCTO";

    }

}


/* =========================
   LIMPIAR FORMULARIO
========================= */

function limpiarFormulario() {

    document
        .getElementById("productoId")
        .value = "";

    document
        .getElementById("nombre")
        .value = "";

    document
        .getElementById("codigo")
        .value = "";

    document
        .getElementById("categoria")
        .value = "";

    document
        .getElementById("color")
        .value = "";

    document
        .getElementById("precio")
        .value = "";

    document
        .getElementById("precioAnterior")
        .value = "";

    document
        .getElementById("oferta")
        .checked = false;

    document
        .getElementById("nuevo")
        .checked = false;

    document
        .getElementById("foto")
        .value = "";

    document
        .getElementById("fotoActual")
        .innerHTML = "";

    document
        .getElementById("nuevoTalle")
        .value = "";

    tallesActuales = {};

    renderizarTalles();

    productoEditando = null;

    mostrarPrecioAnterior();

}


/* =========================
   CANCELAR
========================= */

function cancelarFormulario() {

    limpiarFormulario();

    document
        .getElementById("formulario")
        .classList
        .add("oculto");

}


/* =========================
   EVENTOS
========================= */

document
    .getElementById("btnLogin")
    ?.addEventListener(
        "click",
        iniciarSesion
    );


document
    .getElementById("btnCerrarSesion")
    ?.addEventListener(
        "click",
        cerrarSesion
    );


document
    .getElementById("btnAgregarCategoria")
    ?.addEventListener(
        "click",
        agregarCategoria
    );


/* ENTER PARA LOGIN */

document
    .getElementById("password")
    ?.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                iniciarSesion();

            }

        }
    );


/* =========================
   INICIAR ADMIN
========================= */

async function iniciarAdmin() {

    const {
        data
    } =
        await supabaseClient
        .auth
        .getSession();

    const session =
        data.session;


    if (
        session?.user?.id ===
        ADMIN_UID
    ) {

        document
            .getElementById("login")
            .classList
            .add("oculto");

        document
            .getElementById("admin")
            .classList
            .remove("oculto");

        await cargarCategorias();

        await cargarProductos();

    } else {

        document
            .getElementById("login")
            .classList
            .remove("oculto");

        document
            .getElementById("admin")
            .classList
            .add("oculto");

    }

}


/* CAMBIO DE SESIÓN */

supabaseClient
    .auth
    .onAuthStateChange(
        () => {

            iniciarAdmin();

        }
    );


iniciarAdmin();
