<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - DuckStyle Mayorista</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
    padding: 15px;
}

.contenedor {
    max-width: 900px;
    margin: auto;
}

header {
    background: #111;
    color: white;
    padding: 25px 15px;
    border-radius: 12px;
    text-align: center;
    margin-bottom: 15px;
}

header h1 {
    margin-bottom: 7px;
}

.caja {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

h2 {
    margin-bottom: 15px;
}

input,
select {
    width: 100%;
    padding: 12px;
    margin: 6px 0 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

button {
    border: 0;
    border-radius: 7px;
    padding: 11px 15px;
    background: #111;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin: 4px 2px;
}

button:hover {
    opacity: .85;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.boton-gris {
    background: #777;
}

.boton-rojo {
    background: #b00020;
}

.oculto {
    display: none;
}

.mensaje {
    margin-top: 10px;
    font-weight: bold;
}

.producto {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    margin-top: 12px;
}

.producto img {
    width: 100%;
    max-width: 220px;
    height: 180px;
    object-fit: contain;
    background: #f5f5f5;
    border-radius: 8px;
    display: block;
    margin-bottom: 12px;
}

.producto h3 {
    margin-bottom: 8px;
}

.producto p {
    color: #666;
    margin: 5px 0;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 8px;
}

.talles-admin {
    margin-top: 10px;
    margin-bottom: 15px;
}

.talle-fila {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 8px;
}

.talle-fila input {
    margin: 0;
}

.talle-numero {
    font-weight: bold;
    font-size: 18px;
    min-width: 60px;
}

.boton-agregar-talle {
    width: 100%;
    margin-top: 5px;
}

.quitar-talle {
    background: #b00020;
    padding: 8px 10px;
}

.opciones-extra {
    background: #f8f8f8;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    margin: 15px 0;
}

.opciones-extra h3 {
    margin-bottom: 12px;
}

.check-opcion {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 12px 0;
    cursor: pointer;
}

.check-opcion input {
    width: auto;
    margin: 0;
}

#fotoActual img {
    width: 180px;
    height: 150px;
    object-fit: contain;
    background: #f5f5f5;
    border-radius: 8px;
    margin-top: 8px;
}

.categoria-box {
    background: #f8f8f8;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    margin-top: 15px;
}

.categoria-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #ddd;
    padding: 10px 0;
}

.categoria-item:last-child {
    border-bottom: 0;
}

@media (max-width: 500px) {

    .categoria-item {
        flex-wrap: wrap;
    }

    .talle-fila {
        flex-wrap: wrap;
    }

}

</style>
</head>

<body>

CERRAR SESIÓN

Foto

CANCELAR
</button>

</div>

<h2>
Productos actuales
</h2>

<div id="lista">
Cargando...
</div>

</div>

</div>


<script>

/* =========================
   ADMINISTRADOR
========================= */

const ADMIN_UID =
"0ea64141-8f93-47d0-94c9-f11329b0468b";


/* =========================
   VARIABLES
========================= */

let tallesActuales = {};

let categoriasActuales = [];

let productoEditando = null;


/* =========================
   PRECIO ANTERIOR
========================= */

function mostrarPrecioAnterior() {

    const oferta =
        document
        .getElementById("oferta")
        .checked;

    const campo =
        document
        .getElementById("campoPrecioAnterior");

    if (oferta) {

        campo.classList.remove("oculto");

    } else {

        campo.classList.add("oculto");

        document
        .getElementById("precioAnterior")
        .value = "";

    }
}


/* =========================
   LOGIN
========================= */

async function iniciarSesion() {

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const mensaje =
        document
        .getElementById("mensajeLogin");

    if (!email || !password) {

        mensaje.textContent =
            "Completá correo y contraseña.";

        return;
    }

    mensaje.textContent =
        "Ingresando...";

    const { data, error } =
        await supabaseClient.auth
        .signInWithPassword({

            email: email,
            password: password

        });

    if (error) {

        console.error(error);

        mensaje.textContent =
            "Correo o contraseña incorrectos.";

        return;
    }

    if (
        !data.user ||
        data.user.id !== ADMIN_UID
    ) {

        await supabaseClient.auth.signOut();

        mensaje.textContent =
            "Este usuario no es administrador.";

        return;
    }

    document
        .getElementById("login")
        .classList
        .add("oculto");

    document
        .getElementById("admin")
        .classList
        .remove("oculto");

    await cargarProductos();

    await cargarCategorias();
}


/* =========================
   CERRAR SESIÓN
========================= */

async function cerrarSesion() {

    await supabaseClient.auth.signOut();

    document
        .getElementById("admin")
        .classList
        .add("oculto");

    document
        .getElementById("login")
        .classList
        .remove("oculto");
}


/* =========================
   CARGAR CATEGORÍAS
========================= */

async function cargarCategorias() {

    const lista =
        document.getElementById(
            "listaCategorias"
        );

    const select =
        document.getElementById(
            "categoria"
        );

    lista.innerHTML =
        "Cargando categorías...";

    const { data, error } =
        await supabaseClient
        .from("Categorias")
        .select("*")
        .eq("Activo", true)
        .order("Nombre", {
            ascending: true
        });

    if (error) {

        console.error(error);

        lista.innerHTML =
            "No se pudieron cargar las categorías.";

        return;
    }

    categoriasActuales =
        data || [];

    select.innerHTML = `
        <option value="">
            Seleccionar categoría
        </option>
    `;

    categoriasActuales.forEach(
        categoria => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                categoria.Nombre;

            option.textContent =
                categoria.Nombre;

            select.appendChild(option);

        }
    );

    if (
        categoriasActuales.length === 0
    ) {

        lista.innerHTML =
            "<p>No hay categorías todavía.</p>";

        return;
    }

    lista.innerHTML = "";

    categoriasActuales.forEach(
        categoria => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "categoria-item";

            const nombre =
                document.createElement(
                    "strong"
                );

            nombre.textContent =
                categoria.Nombre;

            const boton =
                document.createElement(
                    "button"
                );

            boton.className =
                "boton-rojo";

            boton.textContent =
                "🗑️ ELIMINAR";

            boton.onclick =
                () =>
                    eliminarCategoria(
                        categoria.id
                    );

            div.appendChild(nombre);

            div.appendChild(boton);

            lista.appendChild(div);

        }
    );
}


/* =========================
   AGREGAR CATEGORÍA
========================= */

async function agregarCategoria() {

    const input =
        document.getElementById(
            "nuevaCategoria"
        );

    const nombre =
        input.value.trim();

    if (!nombre) {

        alert(
            "Escribí el nombre de la categoría."
        );

        return;
    }

    const existente =
        categoriasActuales.find(
            categoria =>
                categoria.Nombre
                .toLowerCase()
                ===
                nombre.toLowerCase()
        );

    if (existente) {

        alert(
            "Esa categoría ya existe."
        );

        return;
    }

    const slug =
        nombre
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .replace(
            /[^a-z0-9]+/g,
            "-"
        )
        .replace(
            /^-+|-+$/g,
            ""
        );

    const { error } =
        await supabaseClient
        .from("Categorias")
        .insert({

            Nombre: nombre,

            Slug: slug,

            Activo: true

        });

    if (error) {

        console.error(error);

        alert(
            "No se pudo agregar la categoría.\n\n" +
            error.message
        );

        return;
    }

    input.value = "";

    await cargarCategorias();
}


/* =========================
   ELIMINAR CATEGORÍA
========================= */

async function eliminarCategoria(id) {

    const confirmar =
        confirm(
            "¿Seguro que querés eliminar esta categoría?"
        );

    if (!confirmar) {
        return;
    }

    const { error } =
        await supabaseClient
        .from("Categorias")
        .update({

            Activo: false

        })
        .eq("id", id);

    if (error) {

        console.error(error);

        alert(
            "No se pudo eliminar la categoría.\n\n" +
            error.message
        );

        return;
    }

    await cargarCategorias();
}


/* =========================
   CARGAR PRODUCTOS
========================= */

async function cargarProductos() {

    const lista =
        document.getElementById(
            "lista"
        );

    lista.innerHTML =
        "Cargando...";

    const { data, error } =
        await supabaseClient
        .from("Productos")
        .select("*")
        .order("id", {
            ascending: true
        });

    if (error) {

        console.error(error);

        lista.innerHTML =
            "Error al cargar los productos.";

        return;
    }

    if (!data || data.length === 0) {

        lista.innerHTML =
            "No hay productos.";

        return;
    }

    lista.innerHTML = "";

    data.forEach(
        producto => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "producto";

            if (producto.Foto) {

                const imagen =
                    document.createElement(
                        "img"
                    );

                imagen.src =
                    producto.Foto;

                imagen.alt =
                    producto.Nombre || "";

                div.appendChild(imagen);
            }

            const titulo =
                document.createElement(
                    "h3"
                );

            titulo.textContent =
                producto.Nombre ||
                "Sin nombre";

            div.appendChild(titulo);

            const codigo =
                document.createElement(
                    "p"
                );

            codigo.textContent =
                "Código: " +
                (producto.Codigo || "-");

            div.appendChild(codigo);

            const categoria =
                document.createElement(
                    "p"
                );

            categoria.textContent =
                "Categoría: " +
                (producto.Categoria || "-");

            div.appendChild(categoria);

            const color =
                document.createElement(
                    "p"
                );

            color.textContent =
                "Color: " +
                (producto.Color || "-");

            div.appendChild(color);

            const precio =
                document.createElement(
                    "p"
                );

            precio.textContent =
                "Precio: $" +
                (producto.Precio || 0);

            div.appendChild(precio);

            let datosTalles = {};

            try {

                datosTalles =
                    typeof producto.Talles ===
                    "string"

                    ? JSON.parse(
                        producto.Talles ||
                        "{}"
                    )

                    : (
                        producto.Talles ||
                        {}
                    );

            } catch {

                datosTalles = {};

            }

            const tallesTexto =
                Object.entries(
                    datosTalles
                )
                .map(
                    ([talle, stock]) =>
                        `${talle} (${stock})`
                )
                .join(" · ");

            const stock =
                document.createElement(
                    "p"
                );

            stock.textContent =
                "Stock: " +
                (
                    tallesTexto ||
                    "Sin talles"
                );

            div.appendChild(stock);

            const editar =
                document.createElement(
                    "button"
                );

            editar.textContent =
                "✏️ EDITAR";

            editar.onclick =
                () =>
                    editarProducto(
                        producto
                    );

            div.appendChild(editar);

            const eliminar =
                document.createElement(
                    "button"
                );

            eliminar.className =
                "boton-rojo";

            eliminar.textContent =
                "🗑️ ELIMINAR";

            eliminar.onclick =
                () =>
                    eliminarProducto(
                        producto.id
                    );

            div.appendChild(eliminar);

            lista.appendChild(div);

        }
    );
}


/* =========================
   MOSTRAR FORMULARIO
========================= */

function mostrarFormulario() {

    limpiarFormulario();

    document
        .getElementById(
            "tituloFormulario"
        )
        .textContent =
        "Nuevo producto";

    document
        .getElementById(
            "formulario"
        )
        .classList
        .remove("oculto");

    renderizarTalles();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================
   EDITAR PRODUCTO
========================= */

function editarProducto(
    producto
) {

    productoEditando =
        producto;

    document
        .getElementById(
            "tituloFormulario"
        )
        .textContent =
        "Editar producto";

    document
        .getElementById(
            "formulario"
        )
        .classList
        .remove("oculto");

    document
        .getElementById(
            "productoId"
        )
        .value =
        producto.id || "";

    document
        .getElementById(
            "nombre"
        )
        .value =
        producto.Nombre || "";

    document
        .getElementById(
            "codigo"
        )
        .value =
        producto.Codigo || "";

    document
        .getElementById(
            "categoria"
        )
        .value =
        producto.Categoria || "";

    document
        .getElementById(
            "color"
        )
        .value =
        producto.Color || "";

    document
        .getElementById(
            "precio"
        )
        .value =
        producto.Precio || "";

    document
        .getElementById(
            "precioAnterior"
        )
        .value =
        producto.PrecioAnterior || "";

    document
        .getElementById(
            "oferta"
        )
        .checked =
        producto.Oferta === true;

    document
        .getElementById(
                    "nuevo"
    )
    .checked = producto.Nuevo === true;

const talles = document.getElementById("tallesAdmin");

if (typeof producto.Talles === "string") {
    try {
        const datosTalles = JSON.parse(producto.Talles || "{}");

        talles.value = Object.entries(datosTalles)
            .map(([talle, stock]) => `${talle}:${stock}`)
            .join(", ");
    } catch {
        talles.value = producto.Talles || "";
    }
} else {
    talles.value = Object.entries(producto.Talles || {})
        .map(([talle, stock]) => `${talle}:${stock}`)
        .join(", ");
}

document.getElementById("foto").value = "";

document.getElementById("btnGuardar").textContent =
    "Actualizar producto";

window.scrollTo({
    top: 0,
    behavior: "smooth"
});

}

async function eliminarProducto(id) {
    if (!confirm("¿Seguro que querés eliminar este producto?")) {
        return;
    }

    const { error } = await supabaseClient
        .from("Productos")
        .delete()
        .eq("id", id);

    if (error) {
        alert("Error al eliminar: " + error.message);
        return;
    }

    alert("Producto eliminado correctamente.");

    await cargarProductos();
    limpiarFormulario();
}

function limpiarFormulario() {
    productoEditando = null;

    document.getElementById("nombre").value = "";
    document.getElementById("codigo").value = "";
    document.getElementById("categoria").value = "";
    document.getElementById("color").value = "";
    document.getElementById("precio").value = "";
    document.getElementById("precioAnterior").value = "";
    document.getElementById("oferta").checked = false;
    document.getElementById("nuevo").checked = false;
    document.getElementById("tallesAdmin").value = "";
    document.getElementById("foto").value = "";

    document.getElementById("btnGuardar").textContent =
        "Guardar producto";
}

function cerrarSesion() {
    supabaseClient.auth.signOut();
}

document
    .getElementById("btnCancelar")
    ?.addEventListener("click", limpiarFormulario);

document
    .getElementById("btnCerrarSesion")
    ?.addEventListener("click", cerrarSesion);

document
    .getElementById("btnGuardar")
    ?.addEventListener("click", guardarProducto);

document
    .getElementById("btnAgregarCategoria")
    ?.addEventListener("click", agregarCategoria);

async function iniciarAdmin() {
    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {
        document.getElementById("login").style.display = "block";
        document.getElementById("admin").style.display = "none";
        return;
    }

    if (session.user.id !== ADMIN_UID) {
        alert("No tenés permiso para entrar al panel.");

        await supabaseClient.auth.signOut();

        document.getElementById("login").style.display = "block";
        document.getElementById("admin").style.display = "none";
        return;
    }

    document.getElementById("login").style.display = "none";
    document.getElementById("admin").style.display = "block";

    await cargarCategorias();
    await cargarProductos();
}

document
    .getElementById("btnLogin")
    ?.addEventListener("click", async () => {
        const email = document.getElementById("email").value.trim();
        const password =
            document.getElementById("password").value;

        if (!email || !password) {
            alert("Completá el email y la contraseña.");
            return;
        }

        const { error } =
            await supabaseClient.auth.signInWithPassword({
                email,
                password
            });

        if (error) {
            alert("Error al iniciar sesión: " + error.message);
            return;
        }

        await iniciarAdmin();
    });

supabaseClient.auth.onAuthStateChange(() => {

iniciarAdmin();
